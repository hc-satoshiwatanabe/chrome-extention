<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Link Dialog for kintone - 経路マップ</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
      background: #f4f6f8;
      color: #222;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    h1 {
      font-size: 16px;
      margin: 0;
    }
    button {
      appearance: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #f0f0f0;
    }
    #empty {
      padding: 40px;
      color: #777;
      font-size: 14px;
    }
    #cy {
      width: 100%;
      height: calc(100vh - 49px);
    }
  </style>
</head>
<body>
  <header>
    <h1>Link Dialog for kintone - 経路マップ</h1>
    <button id="clear">履歴をクリア</button>
  </header>
  <div id="empty" hidden>まだ記録がありません。kintoneを閲覧すると、ここに経路が表示されます。</div>
  <div id="cy" hidden></div>
  <script src="vendor/cytoscape.min.js"></script>
  <script src="map.js"></script>
</body>
</html>
