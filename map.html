<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Link Dialog for kintone - 経路マップ</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
      background: #f4f6f8;
      color: #222;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    h1 {
      font-size: 16px;
      margin: 0;
    }
    button {
      appearance: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #f0f0f0;
    }
    #empty {
      padding: 40px;
      color: #777;
      font-size: 14px;
    }
    #cy {
      width: 100%;
      height: calc(100vh - 49px);
    }

    #drawerOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 100;
    }
    #drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 340px;
      max-width: 90vw;
      background: #fff;
      box-shadow: -2px 0 12px rgba(0, 0, 0, 0.2);
      z-index: 101;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.18s ease-out;
    }
    #drawer.open {
      transform: translateX(0);
    }
    #drawerHeader {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid #eee;
    }
    #drawerTitle {
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
      margin: 0;
    }
    #drawerClose {
      appearance: none;
      border: none;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      color: #555;
      padding: 0 2px;
      flex: 0 0 auto;
    }
    #drawerClose:hover {
      color: #000;
    }
    #drawerBody {
      padding: 12px 16px;
      overflow-y: auto;
      flex: 1 1 auto;
    }
    .drawer-field {
      margin-bottom: 14px;
    }
    .drawer-field .label {
      font-size: 11px;
      color: #888;
      margin-bottom: 3px;
    }
    .drawer-field .value {
      font-size: 13px;
      color: #222;
      word-break: break-all;
    }
    .drawer-field .value a {
      color: #3498db;
    }
    #drawerFooter {
      padding: 12px 16px;
      border-top: 1px solid #eee;
    }
    #drawerOpenBtn {
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Link Dialog for kintone - 経路マップ</h1>
    <button id="clear">履歴をクリア</button>
  </header>
  <div id="empty" hidden>まだ記録がありません。kintoneを閲覧すると、ここに経路が表示されます。</div>
  <div id="cy" hidden></div>

  <div id="drawerOverlay" hidden></div>
  <div id="drawer" role="dialog" aria-label="ノードの詳細">
    <div id="drawerHeader">
      <h2 id="drawerTitle"></h2>
      <button id="drawerClose" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="drawerBody"></div>
    <div id="drawerFooter">
      <button id="drawerOpenBtn" type="button">新しいタブで開く ↗</button>
    </div>
  </div>

  <script src="vendor/cytoscape.min.js"></script>
  <script src="map.js"></script>
</body>
</html>
