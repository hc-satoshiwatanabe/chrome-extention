<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Link Dialog for kintone - 経路マップ</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
      background: #f4f6f8;
      color: #222;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    h1 {
      font-size: 16px;
      margin: 0;
    }
    button {
      appearance: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #f0f0f0;
    }
    #empty {
      padding: 40px;
      color: #777;
      font-size: 14px;
    }
    #scroll {
      overflow: auto;
      width: 100%;
      height: calc(100vh - 49px);
    }
    .node-box {
      fill: #fff;
      stroke: #3498db;
      stroke-width: 1.5;
    }
    .node-label {
      font-size: 12px;
      fill: #222;
    }
    .edge {
      stroke: #b8c4cc;
      stroke-width: 1.5;
      fill: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Link Dialog for kintone - 経路マップ</h1>
    <button id="clear">履歴をクリア</button>
  </header>
  <div id="empty" hidden>まだ記録がありません。kintoneでリンクをダイアログで開くと、ここに経路が表示されます。</div>
  <div id="scroll">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <script src="map.js"></script>
</body>
</html>
