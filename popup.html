<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 220px;
      margin: 0;
      padding: 12px 14px;
      font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 13px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button {
      appearance: none;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <label>
    <input type="checkbox" id="toggle" />
    kintone内の経路を記録する
  </label>
  <button id="openMap" type="button">経路マップを見る</button>
  <script src="popup.js"></script>
</body>
</html>
